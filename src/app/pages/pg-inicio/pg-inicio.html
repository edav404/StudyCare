<main>
<div class="p-6">
  <h1 class="text-3xl font-bold text-blue-700">¡Hola, {{userName}}!</h1>
</div>
<div class="bg-white rounded-xl shadow-xl hover:shadow-2xl transition-shadow shadow-blue-400 p-6 mx-auto max-w-sm">
  <div class="text-center mt-8">
    <p class=" text-lg font-bold text-gray-500 mt-1">¿Listo para equilibrar tu día?</p>

    <div class="relative w-40 h-40 mx-auto mt-6">
      <svg class="absolute top-0 left-0" viewBox="0 0 100 100">
        <!-- Fondo gris -->
        <circle
          cx="50"
          cy="50"
          r="45"
          stroke="#3b82f6"
          stroke-width="10"
          fill="none"
          stroke-dasharray="282.6"
          [attr.stroke-dashoffset]="282.6 - (progressPercent / 100) * 282.6"
          stroke-linecap="round"
          transform="rotate(-90 50 50)"
        />
      </svg>
      <div class="absolute inset-0 flex flex-col items-center justify-center">
        <span class="text-xl font-bold text-gray-800">{{ progressPercent }}%</span>

        <span class="text-sm text-gray-500">Tu Progreso Diario</span>
      </div>
    </div>

    <p class="mt-2 text-gray-500 font-medium">{{getProgressMessage()}}</p>
  </div>
</div>
<div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-8 px-6">
  <div
    *ngFor="let cat of categories"
    class="border rounded-xl p-4 text-center shadow-md hover:shadow-lg transition-shadow"
    [ngClass]="getClass(cat.color)"
  >
    <h2 class="font-bold text-xl" [ngClass]="'text-' + cat.color + '-600'">
      {{ cat.name }}
    </h2>

    <p class="text-gray-700 mt-1">
      {{ cat.completed }}/{{ cat.total }} Tarea{{ cat.total > 1 ? 's' : '' }}
    </p>
<!-- bg-purple-100 text-purple-600 bg-blue-100 text-blue-600 bg-green-100 text-green-600 -->
    <button
      class="mt-3 rounded-full px-3 py-1 text-sm font-bold"
      (click)="addTask(cat)"
      [ngClass]="getClass(cat.color)"
    >
      +
    </button>
  </div>
</div>
</main>
