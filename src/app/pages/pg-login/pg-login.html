<div class="flex flex-col items-center justify-center min-h-screen bg-blue-50 p-6">
  <div class="bg-white shadow-lg rounded-2xl p-8 w-full max-w-sm">
    <h2 class="text-2xl font-bold text-center text-blue-700 mb-4">Iniciar Sesión</h2>

    <input [(ngModel)]="email" placeholder="Correo electrónico" class="w-full mb-3 p-2 border rounded-md" />
    <input [(ngModel)]="password" placeholder="Contraseña" type="password" class="w-full mb-3 p-2 border rounded-md" />

    <button (click)="login()" class="w-full bg-blue-500 text-white py-2 rounded-md hover:bg-blue-600 transition">
      Entrar
    </button>

    <p class="text-center text-sm text-gray-600 mt-4">
      ¿No tienes cuenta?
      <a routerLink="/registrar" class="text-blue-500 hover:underline">Regístrate</a>
    </p>

    <p class="text-center text-red-500 mt-2">{{ mensaje }}</p>
  </div>
</div>
