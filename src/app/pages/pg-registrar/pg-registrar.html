<div
  class="relative flex justify-center items-center min-h-[94vh] overflow-hidden bg-linear-to-br from-blue-100 via-slate-100 to-indigo-200"
>
  <!-- 🔹 Degradado animado suave -->
  <div
    class="absolute w-[500px] h-[500px] bg-linear-to-tr from-purple-500/40 via-indigo-300/30 to-sky-200/50 rounded-full blur-3xl animate-pulse-slow top-[-100px] left-[-150px]"
  ></div>
  <div
    class="absolute w-[600px] h-[600px] bg-linear-to-bl from-purple-500/40 via-slate-200/30 to-blue-300/40 rounded-full blur-3xl animate-pulse-slow bottom-[-200px] right-[-150px]"
  ></div>

  <!-- ✨ Sutil luz central (efecto halo) -->
  <div
    class="absolute w-[300px] h-[300px] bg-white/40 blur-2xl rounded-full opacity-40 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"
  ></div>

  <!-- 🧾 Contenedor del formulario -->
  <div
    class="relative z-10 bg-white/90 backdrop-blur-lg p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-200/70"
  >
    <h1 class="text-3xl font-extrabold text-center text-blue-700 mb-6 tracking-tight">
      Crear cuenta
    </h1>

    <form (ngSubmit)="registrar()" class="flex flex-col gap-4">
      <div>
        <label class="block text-gray-700 font-medium mb-1">Nombre</label>
        <input
          type="text"
          [(ngModel)]="nombre"
          name="nombre"
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-400 focus:outline-none"
        />
      </div>

      <div>
        <label class="block text-gray-700 font-medium mb-1">Correo electrónico</label>
        <input
          type="email"
          [(ngModel)]="correo"
          name="correo"
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-400 focus:outline-none"
        />
      </div>

      <div>
        <label class="block text-gray-700 font-medium mb-1">Contraseña</label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          class="w-full border border-gray-300 rounded-md px-3 py-2 focus:ring-2 focus:ring-blue-400 focus:outline-none"
        />
      </div>

      <button
        type="submit"
        class="mt-4 bg-linear-to-r from-blue-600 to-indigo-600 text-white py-2 rounded-md font-semibold shadow-md hover:shadow-lg hover:from-blue-700 hover:to-indigo-700 transition"
      >
        Registrarme
      </button>
    </form>

    <p class="text-sm text-center text-gray-600 mt-4">
      ¿Ya tienes cuenta?
      <a routerLink="login" class="text-blue-600 hover:underline">Inicia sesión</a>
    </p>
  </div>

  <!-- 💬 Modal elegante -->
  <div
    *ngIf="mostrarModal"
    class="fixed inset-0 bg-black/40 backdrop-blur-sm flex justify-center items-center z-50"
  >
    <div
      class="bg-white/80 backdrop-blur-md rounded-2xl shadow-2xl p-8 max-w-sm w-full text-center animate-fade-in border border-slate-200"
    >
      <h2
        class="text-xl font-semibold mb-3"
        [ngClass]="error ? 'text-red-600' : 'text-blue-600'"
      >
        {{ mensajeTitulo }}
      </h2>
      <p class="text-gray-700 mb-6">{{ mensaje }}</p>

      <!-- Spinner solo si no es error -->
      <div *ngIf="!error" class="flex justify-center mb-6">
        <div
          class="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"
        ></div>
      </div>

      <button
        (click)="cerrarModal()"
        class="bg-blue-600 text-white px-5 py-2 rounded-lg hover:bg-blue-700 transition"
      >
        Cerrar
      </button>
    </div>
  </div>
</div>
