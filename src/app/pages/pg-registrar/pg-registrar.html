<div class="flex flex-col items-center justify-center min-h-screen bg-green-50 p-6">
  <div class="bg-white shadow-lg rounded-2xl p-8 w-full max-w-sm">
    <h2 class="text-2xl font-bold text-center text-green-700 mb-4">Crear Cuenta</h2>

    <input [(ngModel)]="nombre" placeholder="Nombre" class="w-full mb-3 p-2 border rounded-md" />
    <input [(ngModel)]="email" placeholder="Correo electrónico" class="w-full mb-3 p-2 border rounded-md" />
    <input [(ngModel)]="password" placeholder="Contraseña" type="password" class="w-full mb-3 p-2 border rounded-md" />

    <button (click)="registrar()" class="w-full bg-green-500 text-white py-2 rounded-md hover:bg-green-600 transition">
      Registrarse
    </button>

    <p class="text-center text-sm text-gray-600 mt-4">
      ¿Ya tienes cuenta?
      <a routerLink="/login" class="text-green-500 hover:underline">Inicia sesión</a>
    </p>

    <p class="text-center text-blue-600 mt-2">{{ mensaje }}</p>
  </div>
</div>
