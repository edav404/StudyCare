<div class="p-6 min-h-screen bg-gray-50">
  <h1 class="text-2xl font-bold text-blue-700 mb-2">Bienestar y Hábitos Saludables</h1>
  <p class="text-gray-600 mb-6">{{ message }}</p>

  <!-- Progreso -->
  <div class="bg-white p-4 rounded-2xl shadow-sm mb-6">
    <div class="flex justify-between items-center mb-2">
      <span class="font-semibold text-gray-700">Progreso diario</span>
      <span class="text-sm text-gray-500">{{ progress }}%</span>
    </div>
    <div class="w-full bg-gray-200 rounded-full h-3 overflow-hidden">
      <div
        class="bg-blue-500 h-3 transition-all duration-500 ease-in-out"
        [style.width.%]="progress"
      ></div>
    </div>
  </div>

  <!-- Lista de hábitos -->
  <div class="grid gap-3">
    <app-habit-card
      *ngFor="let habit of habits"
      [habit]="habit"
      (toggle)="toggleHabit(habit)"
    ></app-habit-card>
  </div>

  

  <!-- Botón reiniciar -->
  <button
    (click)="resetHabits()"
    class="mt-8 w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition"
  >
    Reiniciar hábitos del día
  </button>
</div>
