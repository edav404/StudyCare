<div class="p-6 min-h-screen bg-gray-50">
  <h1 class="text-2xl font-bold text-blue-700 mb-6">Bienestar y Hábitos Saludables</h1>

  <!-- Lista de hábitos -->
  <div class="grid gap-4 mb-8">
    <app-habit-card
      *ngFor="let habit of habits"
      [habit]="habit"
      (select)="openDetailModal(habit)"
    ></app-habit-card>
  </div>

  <!-- Botón de nuevo hábito -->
  <button
    (click)="openCreateModal()"
    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition"
  >
    ➕ Crear nuevo hábito
  </button>

  <!-- Modal de detalle -->
  <div *ngIf="showDetailModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-2xl p-6 w-80 shadow-lg text-center">
      <div class="text-5xl mb-3">{{ selectedHabit?.icon }}</div>
      <h2 class="text-lg font-semibold mb-1">{{ selectedHabit?.name }}</h2>
      <p class="text-gray-500 text-sm mb-4">{{ selectedHabit?.description }}</p>

      <div class="flex justify-between">
        <button
          (click)="toggleCompleted()"
          class="bg-green-500 text-white px-3 py-2 rounded-lg text-sm hover:bg-green-600"
        >
          {{ selectedHabit?.completed ? 'Desmarcar' : 'Marcar completado' }}
        </button>

        <button
          (click)="deleteHabit()"
          class="bg-red-500 text-white px-3 py-2 rounded-lg text-sm hover:bg-red-600"
        >
          Eliminar
        </button>

      </div>

      <button (click)="closeModals()" class="mt-4 text-gray-500 text-sm hover:underline">Cerrar</button>
    </div>
  </div>

  <!-- Modal de creación -->
  <div *ngIf="showCreateModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-2xl p-6 w-80 shadow-lg text-center">
      <h2 class="text-lg font-semibold mb-3">Crear nuevo hábito</h2>

      <input
        type="text"
        placeholder="Emoji (ej: 🌱)"
        [(ngModel)]="newHabit.icon"
        class="w-full border border-gray-300 rounded-lg p-2 mb-3 text-center"
      />
      <input
        type="text"
        placeholder="Título del hábito"
        [(ngModel)]="newHabit.name"
        class="w-full border border-gray-300 rounded-lg p-2 mb-3"
      />
      <textarea
        placeholder="Descripción breve"
        [(ngModel)]="newHabit.description"
        class="w-full border border-gray-300 rounded-lg p-2 mb-4"
      ></textarea>

      <button
        (click)="createHabit()"
        class="bg-blue-600 text-white w-full py-2 rounded-lg hover:bg-blue-700 font-semibold"
      >
        Guardar hábito
      </button>

      <button (click)="closeModals()" class="mt-4 text-gray-500 text-sm hover:underline">Cancelar</button>
    </div>
  </div>
</div>
