<div class="flex flex-col md:flex-row gap-6 p-6">
  <!-- Columna izquierda-->
  <div class="w-full md:w-1/2 pr-4">
    <!-- Saludo + Selector -->
    <div class="p-6 max-w-xl mx-auto">
      <div class="p-6">
        <h1 class="text-3xl font-bold text-blue-700">¡Hola, {{ userName }}!</h1>
        <p class="text-lg font-semibold text-gray-500 mt-1">¿Como te sientes hoy?</p>
      </div>

      <!-- Tarjeta: Selector de ánimo -->
      <div class="bg-white rounded-xl shadow-md p-4 mb-6">
        <h2 class="text-lg font-semibold text-gray-700 mb-2">Elije el estado de animo que mas te identifique</h2>
        <!-- Aquí irá el selector de emojis -->
        <div class="flex justify-between items-center mt-2">
          <button
            *ngFor="let mood of moods"
            (click)="selectMood(mood.label)"
            class="flex flex-col items-center px-2 py-1 rounded-xl transition-all duration-200"
            [ngClass]="{
              'bg-blue-100 text-blue-600 font-semibold scale-105': selectedMood === mood.label,
              'text-gray-500 hover:text-gray-700': selectedMood !== mood.label
            }"
          >
            <span class="text-3xl">{{ mood.icon }}</span>
            <span class="text-xs mt-1">{{ mood.label }}</span>
          </button>
        </div>
      </div>
    </div>
  </div>
  <!-- Columna derecha-->
  <div class="w-full md:w-1/2 pl-4">
    <!-- Nota + Tips -->
    <!-- Tarjeta: Añadir nota -->
    <div class="bg-white rounded-xl shadow-md p-4 mb-6">
      <h2 class="text-lg font-semibold text-gray-700 mb-2">Añadir una nota</h2>
      <!-- Aquí irá el textarea y botón -->

      <textarea
        [(ngModel)]="note"
        rows="4"
        placeholder="¿Qué tienes en mente?"
        class="w-full p-2 border border-gray-300 rounded-md resize-none focus:outline-none focus:ring-2 focus:ring-blue-400"
      ></textarea>

      <button
        (click)="saveNote()"
        class="mt-3 px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600 transition"
      >
        Guardar Nota
      </button>

      <!-- Mostrar nota guardada -->
      <div
        *ngIf="savedNote"
        class="mt-4 p-3 bg-blue-50 border border-blue-200 rounded-md text-sm text-gray-700"
      >
        <strong>Tu nota de hoy:</strong>
        <p class="mt-1 whitespace-pre-line">{{ savedNote }}</p>
      </div>

      <!-- Tarjeta: Consejos para ti -->
<div class="bg-white rounded-xl shadow-md p-4">
  <h2 class="text-lg font-semibold text-gray-700 mb-2">Para ti</h2>

  <div *ngFor="let tip of filteredTips" class="flex items-start gap-4 mb-4">
    <img
      [src]="tip.iconPath"
      alt="Ícono"
      class="w-10 h-10 object-contain"
    />
    <div>
      <h3 class="text-sm font-semibold text-gray-800">{{ tip.title }}</h3>
      <p class="text-sm text-gray-600 mb-5">{{ tip.description }}</p>
    </div>
  </div>
</div>

    </div>
  </div>
</div>
